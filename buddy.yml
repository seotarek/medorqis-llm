- pipeline: medorqis-ci
  name: MedOrqis CI/CD Quality Pipeline
  refs:
    - refs/heads/main
  events:
    - type: PUSH
      refs:
        - refs/heads/main
  actions:
    - action: Run Unit Tests and Clinical Guardrails
      type: BUILD
      docker_image_name: library/python
      docker_image_tag: "3.11-slim"
      commands: |-
        python3 -m unittest discover tests -v
    - action: Validate Clinical Dataset Integrity
      type: BUILD
      docker_image_name: library/python
      docker_image_tag: "3.11-slim"
      commands: |-
        python3 -c "import json; lines = open('training/medorqis_clinical_instructions.jsonl').readlines(); print(f'Verified {len(lines)} clinical records'); assert len(lines) >= 200"
